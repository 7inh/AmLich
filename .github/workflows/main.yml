name: macOS build
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Vietnamese lunar calendar
        run: swift test --package-path CalendarXLib
      - name: Compile macOS app and WidgetKit extensions
        run: scripts/build-macos.sh
